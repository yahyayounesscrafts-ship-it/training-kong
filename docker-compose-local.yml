volumes:
  kong_data: {}

networks:
  kong-net:
    external: false

services:
  kong-migrations:
    image: kong-local
    # build: .
    command: kong migrations bootstrap
    depends_on:
      - cassandra
    environment:
      KONG_DATABASE: cassandra
      KONG_CASSANDRA_CONTACT_POINTS: cassandra
      KONG_CASSANDRA_PASSWORD: kong
      KONG_PLUGINS: bundled,check-referer
      KONG_LUA_PACKAGE_PATH: /kong/plugins/check-referer/?.lua;;
    networks:
      - kong-net
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure

  kong-migrations-up:
    image: kong-local
    # build: .
    command: kong migrations up && kong migrations finish
    depends_on:
      - cassandra
    environment:
      KONG_DATABASE: cassandra
      KONG_CASSANDRA_CONTACT_POINTS: cassandra
      KONG_CASSANDRA_PASSWORD: kong
      KONG_PLUGINS: bundled,check-referer
      KONG_LUA_PACKAGE_PATH: /kong/plugins/check-referer/?.lua;;
    networks:
      - kong-net
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure

  kong:
    image: kong-local
    # build: .
    user: "${KONG_USER:-kong}"
    depends_on:
      - cassandra
    environment:
      KONG_LOG_LEVEL: info
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_CASSANDRA_CONTACT_POINTS: cassandra
      KONG_DATABASE: cassandra
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PLUGINS: bundled,check-referer
      KONG_LUA_PACKAGE_PATH: /kong/plugins/check-referer/?.lua;;
    networks:
      - kong-net
    ports:
      - "8000:8000/tcp"
      - "127.0.0.1:8001:8001/tcp"
      - "8443:8443/tcp"
      - "127.0.0.1:8444:8444/tcp"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:9.5
    environment:
      POSTGRES_DB: ${KONG_PG_DATABASE:-kong}
      POSTGRES_USER: ${KONG_PG_USER:-kong}
      POSTGRES_PASSWORD_FILE: /run/secrets/kong_postgres_password
    secrets:
      - kong_postgres_password
    ports:
      - "5432:5432/tcp"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${KONG_PG_USER:-kong}"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
    stdin_open: true
    tty: true
    networks:
      - kong-net
    volumes:
      - kong_data:/var/lib/postgresql/data

  cassandra:
    image: cassandra:3.9
    environment:
      MAX_HEAP_SIZE: 256M
      HEAP_NEWSIZE: 128M
    ports:
      - "7000:7000/tcp"
      - "7001:7001/tcp"
      - "7199:7199/tcp"
      - "127.0.0.1:9042:9042/tcp"
      - "9160:9160/tcp"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: on-failure
    stop_signal: SIGKILL
    networks:
      - kong-net

  terragrunt:
    image: cytopia/terragrunt:1.0-0.29
    volumes:
      - ./infra:/data
    working_dir: /data
    environment:
      # les providers sont téléchargés une seule fois, puis partagés par toutes les unités
      TF_PLUGIN_CACHE_DIR: /data/.terraform-plugin-cache
    networks:
      - kong-net

  # Backend "echo" utilisé dans les TPs : renvoie la requête reçue (headers, query, body)
  httpbin:
    image: mccutchen/go-httpbin
    networks:
      - kong-net

  konga:
    image: pantsel/konga
    ports:
      - 1337:1337
    environment:
      - NODE_ENV=production
    networks:
      - kong-net

secrets:
  kong_postgres_password:
    file: ./POSTGRES_PASSWORD
